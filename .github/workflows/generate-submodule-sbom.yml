name: Generate Gradle SBOM per Submodule

on:
  push:
    branches: 
      - "main"
      - "generate-submodule-sbom"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        default: 'main'
        required: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRO: 'temurin'
  PRODUCT_PATH: './'

permissions:
  contents: read

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    outputs:
      sboms: ${{ steps.collect-sboms.outputs.SBOMS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.version }}

      - name: Setup Java SDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Generate sbom
        run: |
          gradle cyclonedxBom

      - name: Collect submodule SBOM files
        id: collect-sboms
        run: |
          event="${{ github.event_name }}"
          ref="${{ github.ref }}"
          input="${{ github.event.inputs.version }}"

          is_dev=""
          if [[ "$event" == "push" && "$ref" == refs/heads/* ]] || \
            [[ "$event" == "workflow_dispatch" && ! "$input" =~ ^v ]]; then
            is_dev="@dev"
          fi

          mkdir sboms
          sbom_list=()

          find . -type f -name "bom.json" -print | while read file; do
            version="$(jq -r '.metadata.component.version' < $file)"
            version="${version}${is_dev}"

            dir_name=$(echo "$file" | cut -d'/' -f2)
            new_name="${dir_name}_bom_${version}.json"
            cp "$file" "sboms/$new_name"

            sbom_list+=("$new_name")
            echo $new_name
            echo $sbom_list
          done

          echo "List: $sbom_list "

          sboms_string=$(IFS=,; echo "${sbom_list[*]}")
          echo "SBOMS=$sboms_string" >> $GITHUB_OUTPUT
          echo "Collected SBOMs: $sboms_string"

      - name: Upload sbom
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sbom
          path: sboms/

  print-sboms:
    runs-on: ubuntu-latest
    needs: ['generate-sbom']
    steps:
      - name: Print SBOMS
        run: |
          echo "SBOM Files: ${{ needs.generate-sbom.outputs.sboms }}"

